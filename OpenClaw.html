<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPENCLAW // SURVIVAL MONITOR</title>
    <!-- Koneksi ke Socket.io di VPS -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --bg: #0b0c15; 
            --panel: #13141f; 
            --text: #a0a0a0; 
            --green: #00ff9d; 
            --red: #ff3366; 
            --blue: #33ccff; 
            --yellow: #ffff00;
        }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Courier New', monospace; 
            margin: 0; 
            padding: 20px; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            box-sizing: border-box; 
            overflow: hidden; 
        }
        
        .header { 
            display: flex; 
            justify-content: space-between; 
            border-bottom: 1px solid #333; 
            padding-bottom: 15px; 
            margin-bottom: 20px; 
            flex-shrink: 0; 
        }
        .badge { 
            background: #00331a; 
            color: var(--green); 
            padding: 5px 12px; 
            border: 1px solid var(--green); 
            border-radius: 4px; 
            font-size: 0.8em; 
            letter-spacing: 1px;
            font-weight: bold;
        }
        
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 15px; 
            margin-bottom: 20px; 
            flex-shrink: 0; 
        }
        .card { 
            background: var(--panel); 
            padding: 15px; 
            border-radius: 6px; 
            border: 1px solid #222; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .card-label { 
            font-size: 0.7em; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            margin-bottom: 8px; 
            color: #666; 
        }
        .card-value { 
            font-size: 1.6em; 
            color: #fff; 
            font-weight: bold; 
        }
        .text-green { color: var(--green); } 
        .text-red { color: var(--red); }

        .main-grid { 
            display: grid; 
            grid-template-columns: 70% 30%; 
            gap: 20px; 
            flex: 1; 
            min-height: 0; 
        }
        .panel { 
            background: var(--panel); 
            border: 1px solid #222; 
            border-radius: 6px; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            position: relative; 
        }
        .panel-header { 
            font-size: 0.8em; 
            margin-bottom: 10px; 
            color: #555; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            border-bottom: 1px solid #222; 
            padding-bottom: 5px; 
        }
        
        #log-feed { 
            flex: 1; 
            overflow-y: auto; 
            font-size: 0.8em; 
            font-family: 'Consolas', 'Monaco', monospace; 
            padding-right: 5px; 
        }
        .log-item { 
            margin-bottom: 4px; 
            padding-bottom: 4px; 
            border-bottom: 1px solid #1a1a1a; 
            display: flex; 
            align-items: baseline; 
        }
        .log-time { color: #444; margin-right: 8px; font-size: 0.9em; min-width: 65px; }
        .log-type { font-weight: bold; margin-right: 8px; min-width: 70px; }
        .log-msg { color: #ccc; word-break: break-word; }
        
        .type-DANGER { color: var(--red); } 
        .type-SUCCESS { color: var(--green); } 
        .type-AI { color: #bd33ff; }
        .type-SINYAL { color: var(--yellow); text-shadow: 0 0 5px var(--yellow); }
        .type-SCANNER { color: var(--blue); }
        .type-SYSTEM { color: #fff; }

        .chart-container { position: relative; flex: 1; width: 100%; height: 100%; }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h2 style="margin:0; font-size: 1.1em; letter-spacing: 2px;">OPENCLAW AGENT <span style="color:#333">//</span> <span id="mode-text">INITIALIZING</span></h2>
        </div>
        <div class="badge" id="status-badge">WAITING CONNECTION</div>
    </div>

    <div class="stats-grid">
        <div class="card">
            <div class="card-label">Current Balance</div>
            <div class="card-value" id="balance">$0.00</div>
        </div>
        <div class="card">
            <div class="card-label">Net Profit</div>
            <div class="card-value text-green" id="pnl">+$0.00</div>
        </div>
        <div class="card">
            <div class="card-label">API Usage Cost</div>
            <div class="card-value text-red" id="api-cost">$0.00</div>
        </div>
        <div class="card">
            <div class="card-label">Active Positions</div>
            <div class="card-value" id="positions">0</div>
        </div>
    </div>

    <div class="main-grid">
        <div class="panel">
            <div class="panel-header">Equity Performance (Log Scale)</div>
            <div class="chart-container">
                <canvas id="chart"></canvas>
            </div>
        </div>
        <div class="panel">
            <div class="panel-header">Survival Logs</div>
            <div id="log-feed"></div>
        </div>
    </div>

    <script>
        // Alamat IP VPS Anda
        const vpsIp = "43.167.197.60";
        const socket = io(`http://${vpsIp}:3000`);
        
        const ctx = document.getElementById('chart').getContext('2d');
        
        // Setup Gradient untuk Grafik
        const gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, 'rgba(0, 255, 157, 0.1)');
        gradient.addColorStop(1, 'rgba(0, 255, 157, 0.0)');

        const chart = new Chart(ctx, {
            type: 'line',
            data: { 
                labels: [], 
                datasets: [{ 
                    label: 'Balance',
                    data: [], 
                    borderColor: '#00ff9d', 
                    borderWidth: 2, 
                    pointRadius: 0,
                    backgroundColor: gradient,
                    fill: true,
                    tension: 0.4
                }] 
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { 
                    x: { display: false }, 
                    y: { 
                        grid: { color: '#1a1b26' },
                        ticks: { color: '#444', font: { size: 10 } }
                    } 
                },
                animation: false
            }
        });

        function updateUI(state) {
            document.getElementById('balance').innerText = `$${state.balance.toFixed(2)}`;
            const pnl = state.netProfit;
            const pnlEl = document.getElementById('pnl');
            pnlEl.innerText = `${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}`;
            pnlEl.className = `card-value ${pnl >= 0 ? 'text-green' : 'text-red'}`;
            
            document.getElementById('api-cost').innerText = `$${state.apiCostPaid.toFixed(3)}`;
            document.getElementById('positions').innerText = state.positions ? state.positions.length : 0;
            document.getElementById('mode-text').innerText = state.mode || 'IDLE';
        }

        function addLog(log) {
            const div = document.createElement('div');
            div.className = 'log-item';
            div.innerHTML = `
                <span class="log-time">${log.time}</span>
                <span class="log-type type-${log.type}">[${log.type}]</span>
                <span class="log-msg">${log.msg}</span>
            `;
            const feed = document.getElementById('log-feed');
            feed.appendChild(div);
            feed.scrollTop = feed.scrollHeight;
        }

        // Socket Events
        socket.on('connect', () => {
            document.getElementById('status-badge').innerText = "● SYSTEM ALIVE";
            document.getElementById('status-badge').style.color = "var(--green)";
            document.getElementById('status-badge').style.borderColor = "var(--green)";
        });

        socket.on('disconnect', () => {
            document.getElementById('status-badge').innerText = "○ SYSTEM OFFLINE";
            document.getElementById('status-badge').style.color = "var(--red)";
            document.getElementById('status-badge').style.borderColor = "var(--red)";
        });

        socket.on('init_state', (state) => {
            updateUI(state);
            if (state.logs) {
                document.getElementById('log-feed').innerHTML = '';
                state.logs.forEach(addLog);
            }
            if (state.history) {
                chart.data.labels = state.history.map(pt => pt.time);
                chart.data.datasets[0].data = state.history.map(pt => pt.value);
                chart.update();
            }
        });

        socket.on('new_log', addLog);
        
        socket.on('update_stats', (state) => {
            updateUI(state);
            const now = new Date().toLocaleTimeString();
            chart.data.labels.push(now);
            chart.data.datasets[0].data.push(state.balance);
            if (chart.data.labels.length > 60) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
            }
            chart.update();
        });
    </script>
</body>
</html>
